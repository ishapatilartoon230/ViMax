# ViMax agent runtime local configuration template.
# Keep real keys out of commits. Prefer environment variables for shared or CI usage.
#
# Defaults target the official Google Gemini API, so a single Google AI Studio
# API key (https://aistudio.google.com/apikey) drives the LLM, image, video,
# and embedding services. Only llm.api_key is required; every other value
# below matches the built-in defaults and can be omitted or overridden.
#
# Alternative gateways stay available: point base_url at yunwu.ai or
# openrouter.ai and the runtime picks the matching adapter automatically.

llm:
  model_provider: openai
  model: gemini-3.8-flash
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key: <YOUR_GOOGLE_API_KEY>

image:
  model: gemini-3.1-flash-image
  base_url: https://generativelanguage.googleapis.com
  api_key: ''  # Falls back to llm.api_key when empty.

# Keyframes: generate candidates concurrently and compare with the configured LLM.
# Set to 1 to generate one image without VLM selection. The LLM must support vision.
image_selection:
  num_candidates: 2

# Veo preview models were retired on the Gemini API; video generation uses
# Gemini Omni Flash through the Interactions API.
video:
  model: gemini-omni-1.1-flash
  base_url: https://generativelanguage.googleapis.com
  api_key: ''  # Falls back to llm.api_key when empty.

# Optional. Fill these only when using novel2video planning.
embedding:
  model_provider: openai
  model: gemini-embedding-001
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key: ''  # Falls back to llm.api_key when empty.

# Optional. Fill these only when using novel2video planning.
# Google has no rerank endpoint; this example uses SiliconFlow.
reranker:
  model: BAAI/bge-reranker-v2-m3
  base_url: <YOUR_RERANKER_BASE_URL>
  api_key: ''

# Optional. Render geometry; defaults produce 16:9 landscape video.
# Use the values below for vertical 9:16 (e.g. mobile/short-form ads).
render:
  image_aspect_ratio: "16:9"     # "9:16" for vertical
  image_size: "1600x900"         # "1080x1920" for vertical
  video_aspect_ratio: "16:9"     # "9:16" for vertical
  video_resolution: "720p"       # "720p" or "1080p"
  allow_portrait: "false"        # "true" for vertical

