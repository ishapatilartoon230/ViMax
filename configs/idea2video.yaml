chat_model:
  init_args:
    model: gemini-3.8-flash
    model_provider: openai
    api_key:  # Google AI Studio API key
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  # Rate limits for chat model API calls
  # Set to null to disable rate limiting for this service
  max_requests_per_minute: 500
  max_requests_per_day: 2000

image_generator:
  class_path: tools.ImageGeneratorNanobananaGoogleAPI
  init_args:
    api_key:
  # Rate limits for image generation API calls
  # Set to null to disable rate limiting for this service
  max_requests_per_minute: 10
  max_requests_per_day: 500


video_generator:
  class_path: tools.VideoGeneratorOmniGoogleAPI
  init_args:
    api_key:
    model: gemini-omni-1.1-flash
  # Rate limits for video generation API calls
  # Set to null to disable rate limiting for this service
  max_requests_per_minute: 2
  max_requests_per_day: 10


image_selection:
  num_candidates: 2  # 1 disables VLM selection; the chat model must support vision.

working_dir: .working_dir/idea2video
